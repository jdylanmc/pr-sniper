<!doctype html>
<html lang="en" data-thematic="off">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PR Sniper demo</title>
    <meta
      name="description"
      content="Try PR Sniper's interactive prototype: a Mac desktop with the menu-bar app and sample data."
    />
    <meta name="theme-color" content="#2e3440" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="fonts/jetbrains-mono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="demo-page.js"></script>
  </head>
  <body class="demo-page">
    <a class="skip" href="#demo-main">Skip to demo</a>
    <header class="head">
      <div class="head-links">
        <a class="head-home" href="https://jdylanmc.github.io/"
          >dylan mccurry</a
        >
        <nav class="head-nav" aria-label="Page">
          <a href="index.html#what">what</a>
          <a href="index.html#why">why</a>
          <a href="index.html#how">how</a>
          <a href="demo.html" aria-current="page">demo</a>
          <a href="index.html#changelog">changelog</a>
        </nav>
        <a class="head-link" href="https://github.com/jdylanmc/pr-sniper"
          >GitHub</a
        >
        <button
          type="button"
          id="thematic-btn"
          class="thematic-btn"
          aria-pressed="false"
        >
          <span class="t-off"
            >thematic<span class="switch" aria-hidden="true"></span
          ></span>
        </button>
      </div>
    </header>
    <main class="demo-main" id="demo-main" tabindex="-1">
      <h1 class="sr-only">PR Sniper demo</h1>
      <div class="demo-stage" id="demo-stage">
        <div class="demo-screen">
          <div class="demo-viewport" id="demo-viewport">
            <iframe
              id="demo-frame"
              title="PR Sniper design prototype: an interactive Mac desktop with the menu-bar app"
              data-src="demo/index.html"
              width="1440"
              height="810"
            ></iframe>
          </div>
          <button
            type="button"
            id="demo-full"
            class="demo-full"
            aria-controls="demo-stage"
            aria-pressed="false"
            aria-label="Full screen"
          >
            <svg
              class="icon-enter"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"></path>
            </svg>
            <svg
              class="icon-exit"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"></path>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
