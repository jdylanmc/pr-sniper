[package]
name = "pr-sniper-foundation-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "pr_sniper_lib"
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.26.1", features = ["v4"] }
chrono-tz = "=0.10.4"
croner = "=4.0.0"
zeroize = "1"
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest-blocking", "rustls-tls", "timing-resistant-secret-traits"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "=2.5.8"
webbrowser = { version = "=1.2.4", features = ["hardened"] }
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "macros", "sync"] }

[dev-dependencies]
github-copilot-sdk = "=1.0.14"
tempfile = "3"
tracing = "0.1"
base64 = "0.22"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Security", "Win32_Storage_EnhancedStorage", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.62.2"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSBundle", "NSString", "NSError"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[[test]]
name = "github_token_store"
path = "../tests/github_token_store.rs"

[[test]]
name = "macos_keychain"
path = "../tests/macos_keychain.rs"

[[test]]
name = "windows_credentials_process"
path = "../tests/windows_credentials_process.rs"

[[test]]
name = "settings_persistence"
path = "../tests/settings_persistence.rs"

[[test]]
name = "settings_sidebar"
path = "../tests/settings_sidebar.rs"

[[test]]
name = "policy_validation"
path = "../tests/policy_validation.rs"

[[test]]
name = "diagnostics"
path = "../tests/diagnostics.rs"

[[test]]
name = "doctrine_seeding"
path = "../tests/doctrine_seeding.rs"

[[test]]
name = "storage_foundations"
path = "../tests/storage_foundations.rs"

[[test]]
name = "windows_startup"
path = "../tests/windows_startup.rs"

[[test]]
name = "windows_notifications"
path = "../tests/windows_notifications.rs"
