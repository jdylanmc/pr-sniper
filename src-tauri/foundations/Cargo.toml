[package]
name = "pr-sniper-foundation-tests"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "pr_sniper_lib"
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.26.1", features = ["v4"] }
chrono-tz = "=0.10.4"
croner = "=4.0.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[[test]]
name = "settings_persistence"
path = "../tests/settings_persistence.rs"

[[test]]
name = "settings_sidebar"
path = "../tests/settings_sidebar.rs"

[[test]]
name = "policy_validation"
path = "../tests/policy_validation.rs"

[[test]]
name = "diagnostics"
path = "../tests/diagnostics.rs"

[[test]]
name = "doctrine_seeding"
path = "../tests/doctrine_seeding.rs"

[[test]]
name = "storage_foundations"
path = "../tests/storage_foundations.rs"
