[package]
name = "pr-sniper"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[lib]
name = "pr_sniper_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }
