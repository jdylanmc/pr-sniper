[package]
name = "pr-sniper"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[lib]
name = "pr_sniper_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.4.4"
plist = "=1.10.1"
uuid = { version = "=1.26.1", features = ["v4"] }
chrono-tz = "=0.10.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
croner = "=4.0.0"
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "macros"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri-plugin-dialog = "=2.7.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
