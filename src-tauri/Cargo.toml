[package]
name = "pr-sniper"
version = "0.1.1"
edition = "2021"
rust-version = "1.98"

[workspace]
members = ["foundations"]
default-members = ["."]
resolver = "2"

[lib]
name = "pr_sniper_lib"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.4.4"
uuid = { version = "=1.26.1", features = ["v4"] }
chrono-tz = "=0.10.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
croner = "=4.0.0"
tokio = { version = "1", features = ["rt", "time", "process", "io-util", "macros", "sync"] }
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri-plugin-dialog = "=2.7.3"
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest-blocking", "rustls-tls", "timing-resistant-secret-traits"] }
webbrowser = { version = "=1.2.4", features = ["hardened"] }
url = "=2.5.8"
github-copilot-sdk = "=1.0.14"
async-trait = "0.1"
base64 = "0.22"
sha2 = "=0.10.9"
tempfile = "3"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "=1.10.1"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSBundle", "NSString", "NSError"] }
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
