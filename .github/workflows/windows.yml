name: Windows frontend and shared checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run build
      - run: npm run test:release:windows
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check native source formatting
        run: cargo fmt --manifest-path src-tauri\Cargo.toml --all --check
      - name: Test production persistence, accounts, startup and runtime (not the full app)
        run: cargo test --manifest-path src-tauri\foundations\Cargo.toml --locked
      - name: Handshake with bundled Windows runtime (offline, no credentials or inference)
        run: cargo test --manifest-path src-tauri\foundations\Cargo.toml --locked --lib copilot::runtime::tests::bundled_runtime_handshakes_offline_without_credentials -- --exact --ignored --nocapture
      - name: Lint production foundations
        run: cargo clippy --manifest-path src-tauri\foundations\Cargo.toml --locked --all-targets -- -D warnings
