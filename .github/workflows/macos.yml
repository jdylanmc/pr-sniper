name: macOS foundation

on:
  pull_request:
  push:
    branches: [main, feat/macos-foundation]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - name: Verify bundled macOS Agent Intelligence (offline, no credentials or inference)
        id: agent-intelligence-offline
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib review::runtime::tests::bundled_runtime_intelligence_offline -- --exact --ignored --nocapture --test-threads=1
        timeout-minutes: 2
      - run: npm run test:release
      - run: npm exec playwright install chromium
      - run: npm run test:settings
      - run: npm run bundle
      - name: Verify native notification bundle identity
        run: |
          bundle="src-tauri/target/release/bundle/macos/PR Sniper.app"
          codesign --verify --strict "$bundle"
          signature="$(codesign -dv --verbose=2 "$bundle" 2>&1)"
          expected="$(plutil -extract CFBundleIdentifier raw -o - "$bundle/Contents/Info.plist")"
          actual="$(printf '%s\n' "$signature" | sed -n 's/^Identifier=//p')"
          test "$actual" = "$expected"
          printf '%s\n' "$signature" | grep -q '^Info.plist entries='
      - name: Compile native acceptance harness
        run: swiftc tests/macos-native-smoke.swift -o "$RUNNER_TEMP/pr-sniper-native-smoke"
      - name: Archive bundle with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/PR Sniper.app" "$RUNNER_TEMP/PR-Sniper-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: pr-sniper-macos-local
          path: ${{ runner.temp }}/PR-Sniper-macos.zip
          if-no-files-found: error
