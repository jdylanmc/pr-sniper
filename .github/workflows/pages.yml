name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "prototypes/v2/**"
      - "CHANGELOG.md"
      - "tests/site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "prototypes/v2/**"
      - "CHANGELOG.md"
      - "tests/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
        timeout-minutes: 5
      - run: npm ci
        timeout-minutes: 5
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        timeout-minutes: 1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
        timeout-minutes: 5
      # System packages come from the runner's apt mirror, which intermittently
      # stalls. Let apt time out and retry its own downloads instead of killing
      # it mid-install (which leaves dpkg locked), and repair dpkg between tries.
      - name: Install Playwright system dependencies
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null
          for attempt in 1 2 3; do
            npx playwright install-deps chromium webkit && exit 0
            echo "install-deps attempt $attempt failed; retrying"
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1
        timeout-minutes: 17
      - run: npx playwright install chromium webkit
        timeout-minutes: 10
      - run: npm run test:site
        timeout-minutes: 10

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Assemble site artifact
        run: |
          mkdir _site
          cp -R site/. _site/
          cp CHANGELOG.md _site/CHANGELOG.md
          mkdir _site/demo
          cp prototypes/v2/index.html prototypes/v2/style.css prototypes/v2/app.js \
            prototypes/v2/model.js prototypes/v2/sniper-mark.png \
            prototypes/v2/wallpaper.svg _site/demo/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
