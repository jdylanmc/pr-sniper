name: Signed macOS release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-sniper-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require stable tagged main commit and exact green CI
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release.py gate

  tap-ready:
    needs: gate
    runs-on: ubuntu-latest
    environment: pr-sniper-tap
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Require scoped tap dispatch access and merged publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 -B scripts/release.py tap-ready

  sign:
    needs: [gate, tap-ready]
    runs-on: macos-15
    environment: pr-sniper-release
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check Apple Silicon host and pinned toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain
      - run: npm ci
      - name: Build credential-free application bundle
        run: npm run bundle
      - name: Sign, notarize, staple and verify final archive
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: python3 -B scripts/sign_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarized-macos-release
          path: ${{ runner.temp }}/pr-sniper-release-assets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [gate, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notarized-macos-release
          path: ${{ runner.temp }}/pr-sniper-release-assets
      - name: Publish only verified versioned bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/release.py publish

  tap:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    # Bounded same-version redispatch on tap install-verification failure.
    timeout-minutes: 240
    environment: pr-sniper-tap
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notarized-macos-release
          path: ${{ runner.temp }}/pr-sniper-release-assets
      - name: Verify public bytes, dispatch tap publisher and confirm exact cask
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 -B scripts/release.py tap

  windows-build:
    needs: gate
    runs-on: windows-2022
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Rust dependencies (never writes)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-2022-release
          cache-bin: "false"
          cache-targets: "false"
          cache-directories: |
            src-tauri\target\release\.fingerprint
            src-tauri\target\release\build
            src-tauri\target\release\deps
          cache-workspace-crates: "false"
          cache-on-failure: "false"
          save-if: "false"
      - name: Require exact-commit green Windows and macOS CI before building release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/release.py check-windows-release
      - name: Build standalone executable with embedded frontend
        run: npm run build:windows
      - name: Bundle unsigned current-user NSIS installer
        run: npm run bundle:windows
      - name: Verify GUI executable and record artifact provenance
        run: .\scripts\windows-artifact.ps1
      - name: Verify installer and record exact-source provenance
        run: .\scripts\windows-installer-artifact.ps1
      - name: Stage and validate public Windows release assets
        run: python -B scripts/release.py stage-windows-release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-assets
          path: ${{ runner.temp }}/pr-sniper-windows-release-assets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-publish:
    needs: [gate, publish, tap, windows-build]
    runs-on: windows-2022
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-assets
          path: ${{ runner.temp }}/pr-sniper-windows-release-assets
      - name: Publish verified Windows release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/release.py publish-windows
      - name: Generate PublicUnsigned Chocolatey package and pack nupkg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $assets = Join-Path $env:RUNNER_TEMP 'pr-sniper-windows-release-assets'
          $manifest = Get-Content (Join-Path $assets 'windows-manifest.json') -Raw | ConvertFrom-Json
          $installer = Join-Path $assets $manifest.filename
          $chocoDir = Join-Path $env:RUNNER_TEMP 'pr-sniper-chocolatey-package'
          $url = "https://github.com/jdylanmc/pr-sniper/releases/download/$($manifest.tag)/$($manifest.filename)"
          $license = "https://github.com/jdylanmc/pr-sniper/blob/$($manifest.source_sha)/LICENSE"
          .\scripts\windows-chocolatey.ps1 -Mode PublicUnsigned -Installer $installer -Version $manifest.version -Sha256 $manifest.sha256 -Commit $manifest.source_sha -Destination $chocoDir -Url $url -LicenseUrl $license
          choco pack (Join-Path $chocoDir 'pr-sniper.nuspec') --output-directory=$assets
          if ($LASTEXITCODE -ne 0) { throw 'choco pack failed.' }
          python -B scripts/release.py verify-choco-nupkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chocolatey-release-package
          path: ${{ runner.temp }}/pr-sniper-windows-release-assets/pr-sniper.*.nupkg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  chocolatey:
    needs: [gate, windows-publish]
    runs-on: windows-2022
    environment: pr-sniper-chocolatey
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-assets
          path: ${{ runner.temp }}/pr-sniper-windows-release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chocolatey-release-package
          path: ${{ runner.temp }}/pr-sniper-windows-release-assets
      - name: Publish and reconcile Chocolatey package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: python -B scripts/release.py choco-publish
