name: macOS WebKit browser

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  webkit:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
        timeout-minutes: 5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
        timeout-minutes: 5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
        timeout-minutes: 5
      - run: npm ci
        timeout-minutes: 5
      - name: Install matching WebKit browser
        run: npm exec playwright install webkit
        timeout-minutes: 5
      - name: Build frontend and Store bridge
        run: npm run build && cargo build --manifest-path src-tauri/Cargo.toml --locked --example settings_bridge
        timeout-minutes: 30
      - name: Run the full WebKit suite
        id: browser-tests
        env:
          QUEUE_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm exec playwright -- test --config tests/settings/playwright.config.mjs --browser=webkit --workers=2
        timeout-minutes: 30
      - name: Retain Queue reload failure evidence
        if: ${{ always() && steps.browser-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 5
        with:
          name: queue-reload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/settings-browser/**/queue-reload/*.png
            src-tauri/target/settings-browser/**/queue-reload/manifest.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
