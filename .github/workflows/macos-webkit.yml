name: macOS WebKit browser

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  webkit:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
        timeout-minutes: 5
      - run: npm ci
        timeout-minutes: 5
      - name: Install matching WebKit browser
        run: npm exec playwright install webkit
        timeout-minutes: 5
      - name: Build frontend and Store bridge, then run the full WebKit suite
        run: npm run test:settings -- --browser=webkit
        timeout-minutes: 25
